<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · ChangeRelay</title><link rel="stylesheet" href="/style.css"></head>
<body><main style="max-width:470px;margin:55px auto;padding:24px"><a href="/" class="brand" style="text-decoration:none;color:inherit"><span class="logo">↗↗</span>ChangeRelay.</a><div class="card" style="margin-top:35px"><div class="eyebrow">YOUR ORGANISER WORKSPACE</div><h1 id="auth-title">Welcome back.</h1><p id="auth-description">Sign in to review and coordinate your event changes.</p><div id="auth-status" role="status" aria-live="polite">Checking account setup…</div><form id="auth-form" hidden><label for="email">Email address</label><input required type="email" id="email" name="email" autocomplete="email" maxlength="254"><label for="password">Password</label><input required type="password" id="password" name="password" autocomplete="current-password" maxlength="128"><button id="submit" class="primary" style="width:100%;margin-top:24px" type="submit">Sign in</button></form><button type="button" id="auth-switch" hidden style="width:100%;margin-top:12px">Create an account</button><button type="button" id="sign-out" hidden style="width:100%;margin-top:12px">Sign out</button><div class="divider"></div><a href="/#dashboard">Explore the sample workspace →</a></div><p style="font-size:12px;margin-top:18px">Account access and Google app connections are separate. Review each connection before granting access.</p></main><script src="/auth.js" defer></script></body></html>
